openapi: 3.0.3
info:
  title: Multi-Tenant Team Management & Dynamic RBAC API
  description: >
    Production-grade RESTful API providing Multi-Tenant Team Management, Dynamic Role-Based Access Control (RBAC),
    Hierarchical Permission Scoping, and Context-Aware Access Evaluation.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local Development Server

tags:
  - name: Authentication
    description: Identity verification, JWT generation, and password lifecycle management
  - name: Authorization Engine
    description: Dynamic, context-aware policy evaluation across teams and resources
  - name: Permissions Catalog
    description: Canonical system permission discovery and category filtering
  - name: Roles & Permissions
    description: Dynamic role CRUD, system role immutability, and role-permission junction management
  - name: Teams
    description: Multi-tenant team workspace CRUD and soft-archival management
  - name: Memberships
    description: Team membership onboarding, listings, and lifecycle state transitions (suspend, reactivate, remove)
  - name: Users
    description: User discovery and safe catalog search
  - name: Team Membership Roles
    description: Team-scoped role assignments, TTL expiration management, and soft-revocation

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT Bearer token obtained from `/api/auth/login`.

  schemas:
    # Error Model
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: "Role not found or is not active."
            code:
              type: string
              example: "NOT_FOUND"
            statusCode:
              type: integer
              example: 404
            details:
              type: string
              nullable: true
              example: null

    # User Profile Model
    User:
      type: object
      properties:
        id:
          type: string
          example: "65b8c1e6c87881daf598bb12"
        name:
          type: string
          example: "Alice Johnson"
        email:
          type: string
          example: "alice@example.com"
        accountStatus:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, DISABLED]
          example: "ACTIVE"
        mustChangePassword:
          type: boolean
          example: false

    # Permission Model
    Permission:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb34"
        key:
          type: string
          example: "task.create"
        resource:
          type: string
          example: "task"
        action:
          type: string
          example: "create"
        category:
          type: string
          enum: [TEAM_MANAGEMENT, TASK_MANAGEMENT, ROLE_MANAGEMENT, PERMISSION_MANAGEMENT, ACCESS_REQUESTS, AUDIT_SECURITY, NOTIFICATIONS, SYSTEM_ADMIN]
          example: "TASK_MANAGEMENT"
        description:
          type: string
          example: "Ability to create new tasks within a team"

    # Role Model
    Role:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb56"
        name:
          type: string
          example: "QA Reviewer"
        description:
          type: string
          example: "Custom quality assurance role"
        isSystemRole:
          type: boolean
          example: false
        status:
          type: string
          enum: [ACTIVE, DISABLED, ARCHIVED]
          example: "ACTIVE"
        createdBy:
          type: string
          example: "65b8c1e6c87881daf598bb12"
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    # Membership Role Model
    MembershipRole:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb78"
        membershipId:
          type: string
          example: "65b8c1e6c87881daf598bb60"
        roleId:
          $ref: '#/components/schemas/Role'
        assignedBy:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            email:
              type: string
        assignedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedBy:
          type: string
          nullable: true
        derivedState:
          type: string
          enum: [ACTIVE, EXPIRED, REVOKED]
          example: "ACTIVE"

    # Team Model
    Team:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb90"
        name:
          type: string
          example: "Mobile Platform"
        description:
          type: string
          example: "Mobile apps and SDK engineering"
        createdBy:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            email:
              type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Membership Model
    Membership:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb95"
        userId:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            email:
              type: string
            accountStatus:
              type: string
        teamId:
          type: string
          example: "65b8c1e6c87881daf598bb90"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, REMOVED]
          example: "ACTIVE"
        joinedAt:
          type: string
          format: date-time
        removedAt:
          type: string
          format: date-time
          nullable: true

paths:
  # ============================================================================
  # 1. AUTHENTICATION
  # ============================================================================
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: User Login & JWT Issuance
      description: Authenticates user credentials and returns a signed JWT access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "alice@example.com"
                password:
                  type: string
                  example: "Password123!"
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsIn..."
                      requiresPasswordChange:
                        type: boolean
                        example: false
        400:
          description: Invalid input format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Account suspended or disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get Current Authenticated Profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current user profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        401:
          description: Unauthorized / Missing token

  /api/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change User Password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: "OldPassword123!"
                newPassword:
                  type: string
                  example: "NewStrongPass123!"
      responses:
        200:
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password changed successfully."
        400:
          description: Invalid password format or incorrect current password

  # ============================================================================
  # 2. AUTHORIZATION ENGINE
  # ============================================================================
  /api/authorization/can:
    post:
      tags: [Authorization Engine]
      summary: Evaluate Single Permission
      description: Real-time decision check evaluating team roles, membership status, and direct grants.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, permissionKey]
              properties:
                teamId:
                  type: string
                  example: "65b8c1e6c87881daf598bb80"
                permissionKey:
                  type: string
                  example: "task.create"
                resource:
                  type: string
                  nullable: true
                  example: "task:65b8c1e6c87881daf598bb90"
      responses:
        200:
          description: Authorization evaluation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                    example: true
                  userId:
                    type: string
                  teamId:
                    type: string
                  permissionKey:
                    type: string

  /api/authorization/permissions:
    get:
      tags: [Authorization Engine]
      summary: List Resolved Permissions for User in Team
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: Deduplicated list of resolved permission keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: string
                    example: ["task.create", "task.read", "team.update"]

  # ============================================================================
  # 3. PERMISSIONS CATALOG
  # ============================================================================
  /api/permissions:
    get:
      tags: [Permissions Catalog]
      summary: List Canonical Permissions
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [TEAM_MANAGEMENT, TASK_MANAGEMENT, ROLE_MANAGEMENT, PERMISSION_MANAGEMENT, ACCESS_REQUESTS, AUDIT_SECURITY, NOTIFICATIONS, SYSTEM_ADMIN]
        - name: resource
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      responses:
        200:
          description: Filtered permissions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
                  count:
                    type: integer

  /api/permissions/{permissionId}:
    get:
      tags: [Permissions Catalog]
      summary: Get Single Permission by ID
      security:
        - bearerAuth: []
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Permission details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Permission'

  # ============================================================================
  # 4. ROLES & ROLE-PERMISSIONS
  # ============================================================================
  /api/roles:
    post:
      tags: [Roles & Permissions]
      summary: Create Dynamic Custom Role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "QA Lead"
                description:
                  type: string
                  example: "Quality Assurance team lead role"
                permissionIds:
                  type: array
                  items:
                    type: string
                  example: ["65b8c1e6c87881daf598bb34"]
      responses:
        201:
          description: Custom role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Role'

    get:
      tags: [Roles & Permissions]
      summary: List Roles
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DISABLED, ARCHIVED]
      responses:
        200:
          description: Roles list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  count:
                    type: integer

  /api/roles/{roleId}:
    get:
      tags: [Roles & Permissions]
      summary: Get Role Details by ID
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Role details with attached permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Role'

    patch:
      tags: [Roles & Permissions]
      summary: Update Role Metadata or Status
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [ACTIVE, DISABLED]
      responses:
        200:
          description: Role updated

    delete:
      tags: [Roles & Permissions]
      summary: Soft Archive Role
      description: Soft-archives a custom role. System roles cannot be deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Role archived

  /api/roles/{roleId}/permissions:
    post:
      tags: [Roles & Permissions]
      summary: Assign Permissions to Role
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds:
                  type: array
                  items:
                    type: string
      responses:
        200:
          description: Permissions attached to role

    get:
      tags: [Roles & Permissions]
      summary: List Permissions for Role
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of permissions attached to the role

  /api/roles/{roleId}/permissions/{permissionId}:
    delete:
      tags: [Roles & Permissions]
      summary: Remove Permission from Role
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Permission removed from role

  # ============================================================================
  # 5. TEAM MEMBERSHIP ROLES
  # ============================================================================
  /api/teams/{teamId}/members/{userId}/roles:
    post:
      tags: [Team Membership Roles]
      summary: Assign Role to Team Member
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
                  example: "65b8c1e6c87881daf598bb56"
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                  example: "2026-12-31T23:59:59.000Z"
      responses:
        201:
          description: Role assigned to team member
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/MembershipRole'

    get:
      tags: [Team Membership Roles]
      summary: List Member Roles with Derived States
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of member role assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MembershipRole'
                  count:
                    type: integer

  /api/teams/{teamId}/members/{userId}/roles/{assignmentId}:
    patch:
      tags: [Team Membership Roles]
      summary: Update Role Assignment TTL Expiration
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expiresAt]
              properties:
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                  example: "2027-01-01T00:00:00.000Z"
      responses:
        200:
          description: Assignment TTL updated

    delete:
      tags: [Team Membership Roles]
      summary: Soft Revoke Role Assignment
      description: Sets revokedAt and revokedBy without destroying the MongoDB audit history.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Role assignment revoked successfully

  # ============================================================================
  # 6. TEAMS (WORKSPACE MANAGEMENT)
  # ============================================================================
  /api/teams:
    post:
      tags: [Teams]
      summary: Create New Team Workspace
      description: Creates a new team workspace and automatically onboards the creator as the first active member.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Mobile Platform"
                description:
                  type: string
                  example: "Mobile apps and SDK engineering"
      responses:
        201:
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Team'
        400:
          description: Invalid inputs or missing team name
        409:
          description: Team name already exists

    get:
      tags: [Teams]
      summary: List Teams (Paginated & Searchable)
      description: Returns a paginated list of non-archived teams. Supports search query filtering.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: List of teams retrieved successfully

  /api/teams/{teamId}:
    get:
      tags: [Teams]
      summary: Get Team By ID
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Team details retrieved successfully
        404:
          description: Team not found or is archived

    patch:
      tags: [Teams]
      summary: Update Team Metadata
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        200:
          description: Team updated successfully
        404:
          description: Team not found
        409:
          description: Team name collision

    delete:
      tags: [Teams]
      summary: Soft Archive Team Workspace
      description: Marks team status as ARCHIVED without deleting historical data.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Team archived successfully
        404:
          description: Team not found

  # ============================================================================
  # 7. MEMBERSHIPS & LIFECYCLE
  # ============================================================================
  /api/teams/{teamId}/members:
    post:
      tags: [Memberships]
      summary: Add Member to Team Workspace
      description: Adds an existing user to the team with status ACTIVE. If previously removed, reactivates their membership.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  example: "65b8c1e6c87881daf598bb12"
      responses:
        201:
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Membership'
        404:
          description: Team or user not found
        409:
          description: User is already an active member

    get:
      tags: [Memberships]
      summary: List Team Members (Paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: List of team members retrieved successfully

  /api/teams/{teamId}/members/{membershipId}:
    get:
      tags: [Memberships]
      summary: Get Single Membership Details
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Membership retrieved successfully
        404:
          description: Membership not found in team

    delete:
      tags: [Memberships]
      summary: Remove Member From Team Workspace
      description: Transitions membership status to REMOVED, sets removedAt, and soft-revokes all active assigned roles.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Member removed successfully
        404:
          description: Membership not found

  /api/teams/{teamId}/members/{membershipId}/suspend:
    patch:
      tags: [Memberships]
      summary: Suspend Member (Temporary Access Block)
      description: Sets membership status to SUSPENDED. The authorization engine immediately denies all access without deleting role assignments.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Membership suspended successfully
        400:
          description: Membership is already suspended
        404:
          description: Membership not found

  /api/teams/{teamId}/members/{membershipId}/reactivate:
    patch:
      tags: [Memberships]
      summary: Reactivate Suspended Member
      description: Restores membership status to ACTIVE, immediately reenabling access according to their assigned roles.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Membership reactivated successfully
        400:
          description: Membership is already active
        404:
          description: Membership not found

  # ============================================================================
  # 8. USERS (DISCOVERY & SEARCH)
  # ============================================================================
  /api/users/search:
    get:
      tags: [Users]
      summary: Search Users by Name or Email
      description: Allows discovering candidate users for team onboarding. Safely projects profile attributes without password hashes.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            example: "Grace"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: User search results retrieved successfully

  /api/users:
    get:
      tags: [Users]
      summary: List All Non-Disabled Users
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Users list retrieved successfully
