openapi: 3.0.3
info:
  title: Multi-Tenant Team Management & Dynamic RBAC API
  description: >
    Production-grade RESTful API providing Multi-Tenant Team Management, Dynamic Role-Based Access Control (RBAC),
    Hierarchical Permission Scoping, and Context-Aware Access Evaluation.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local Development Server

tags:
  - name: Authentication
    description: Identity verification, JWT generation, and password lifecycle management
  - name: Authorization Engine
    description: Dynamic, context-aware policy evaluation across teams and resources
  - name: Permissions Catalog
    description: Canonical system permission discovery and category filtering
  - name: Roles & Permissions
    description: Dynamic role CRUD, system role immutability, and role-permission junction management
  - name: Teams
    description: Multi-tenant team workspace CRUD and soft-archival management
  - name: Memberships
    description: Team membership onboarding, listings, and lifecycle state transitions (suspend, reactivate, remove)
  - name: Users
    description: User discovery and safe catalog search
  - name: Team Membership Roles
    description: Team-scoped role assignments, TTL expiration management, and soft-revocation
  - name: Workspace Invitations
    description: Cryptographic token-based team invitations, onboarding gateway, and invitation lifecycle management
  - name: Team Tasks
    description: Multi-tenant task CRUD, active-membership assignee verification, and fine-grained resource authorization
  - name: Access Requests & Grants
    description: Just-in-time privilege elevation, temporary direct grants, self-service request modifications, and reviewer decision control plane
  - name: Audit Logs
    description: Security audit ledger tracking system mutations, auth attempts, role assignments, and access evaluations
  - name: Notifications
    description: In-app notification inbox and real-time alerts


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT Bearer token obtained from `/api/auth/login`.

  schemas:
    # Error Model
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: "Role not found or is not active."
            code:
              type: string
              example: "NOT_FOUND"
            statusCode:
              type: integer
              example: 404
            details:
              type: string
              nullable: true
              example: null

    # User Profile Model
    User:
      type: object
      properties:
        id:
          type: string
          example: "65b8c1e6c87881daf598bb12"
        name:
          type: string
          example: "Alice Johnson"
        email:
          type: string
          example: "alice@example.com"
        accountStatus:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, DISABLED]
          example: "ACTIVE"
        mustChangePassword:
          type: boolean
          example: false

    # Permission Model
    Permission:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb34"
        key:
          type: string
          example: "task.create"
        resource:
          type: string
          example: "task"
        action:
          type: string
          example: "create"
        category:
          type: string
          enum: [TEAM_MANAGEMENT, TASK_MANAGEMENT, ROLE_MANAGEMENT, PERMISSION_MANAGEMENT, ACCESS_REQUESTS, AUDIT_SECURITY, NOTIFICATIONS, SYSTEM_ADMIN]
          example: "TASK_MANAGEMENT"
        description:
          type: string
          example: "Ability to create new tasks within a team"

    # Role Model
    Role:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb56"
        name:
          type: string
          example: "QA Reviewer"
        description:
          type: string
          example: "Custom quality assurance role"
        isSystemRole:
          type: boolean
          example: false
        status:
          type: string
          enum: [ACTIVE, DISABLED, ARCHIVED]
          example: "ACTIVE"
        createdBy:
          type: string
          example: "65b8c1e6c87881daf598bb12"
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    # Membership Role Model
    MembershipRole:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb78"
        membershipId:
          type: string
          example: "65b8c1e6c87881daf598bb60"
        roleId:
          $ref: '#/components/schemas/Role'
        assignedBy:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            email:
              type: string
        assignedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedBy:
          type: string
          nullable: true
        derivedState:
          type: string
          enum: [ACTIVE, EXPIRED, REVOKED]
          example: "ACTIVE"

    # Team Model
    Team:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb90"
        name:
          type: string
          example: "Mobile Platform"
        description:
          type: string
          example: "Mobile apps and SDK engineering"
        createdBy:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            email:
              type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Membership Model
    Membership:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb95"
        userId:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            email:
              type: string
            accountStatus:
              type: string
        teamId:
          type: string
          example: "65b8c1e6c87881daf598bb90"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, REMOVED]
          example: "ACTIVE"
        joinedAt:
          type: string
          format: date-time
        removedAt:
          type: string
          format: date-time
          nullable: true

    Task:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb95"
        title:
          type: string
          example: "Implement Realtime Socket.IO Auth Middleware"
        description:
          type: string
          example: "Setup JWT handshake parsing and channel authorization."
        teamId:
          type: string
          example: "65b8c1e6c87881daf598bb90"
        createdBy:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            email:
              type: string
        assignedTo:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            name:
              type: string
            email:
              type: string
        status:
          type: string
          enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE, CANCELLED]
          example: "TODO"
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
          example: "HIGH"
        dueDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          example: "Implement Realtime Socket.IO Auth Middleware"
        description:
          type: string
          maxLength: 2000
          example: "Setup JWT handshake parsing and channel authorization."
        assignedTo:
          type: string
          nullable: true
          example: "65b8c1e6c87881daf598bb92"
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
          example: "HIGH"
        dueDate:
          type: string
          format: date-time
          nullable: true

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        assignedTo:
          type: string
          nullable: true
        status:
          type: string
          enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE, CANCELLED]
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, URGENT]
        dueDate:
          type: string
          format: date-time
          nullable: true

    AccessRequest:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb97"
        requesterId:
          type: object
          properties:
            _id: { type: string }
            name: { type: string }
            email: { type: string }
        targetUserId:
          type: object
          properties:
            _id: { type: string }
            name: { type: string }
            email: { type: string }
        teamId:
          type: string
          example: "65b8c1e6c87881daf598bb90"
        permissionId:
          type: object
          properties:
            _id: { type: string }
            key: { type: string, example: "task.delete" }
        resource:
          type: string
          example: "task:65b8c1e6c87881daf598bb95"
        reason:
          type: string
          example: "Need to clean up corrupted test task"
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED, EXPIRED]
          example: "PENDING"
        reviewedBy:
          type: object
          nullable: true
          properties:
            _id: { type: string }
            name: { type: string }
            email: { type: string }
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AccessGrant:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb98"
        userId:
          type: string
          example: "65b8c1e6c87881daf598bb92"
        teamId:
          type: string
          example: "65b8c1e6c87881daf598bb90"
        permissionId:
          type: string
          example: "65b8c1e6c87881daf598bb88"
        resource:
          type: string
          example: "task:65b8c1e6c87881daf598bb95"
        grantedBy:
          type: string
          example: "65b8c1e6c87881daf598bb91"
        source:
          type: string
          enum: [MANUAL, ACCESS_REQUEST, DELEGATION, SYSTEM]
          example: "ACCESS_REQUEST"
        accessRequestId:
          type: string
          example: "65b8c1e6c87881daf598bb97"
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED]
          example: "ACTIVE"
        expiresAt:
          type: string
          format: date-time
          nullable: true

    CreateAccessRequestInput:
      type: object
      required: [permissionKey, resource]
      properties:
        targetUserId:
          type: string
          description: Beneficiary User ID (defaults to authenticated requester)
          example: "65b8c1e6c87881daf598bb92"
        permissionKey:
          type: string
          example: "task.delete"
        resource:
          type: string
          example: "task:65b8c1e6c87881daf598bb95"
        reason:
          type: string
          maxLength: 1000
          example: "Need to clean up corrupted test task"
        durationHours:
          type: number
          example: 2

    UpdateAccessRequestInput:
      type: object
      properties:
        permissionKey:
          type: string
          example: "task.delete"
        resource:
          type: string
          example: "task:65b8c1e6c87881daf598bb95"
        reason:
          type: string
          example: "Updated justification reason"
        durationHours:
          type: number
          example: 4

    ApproveAccessRequestInput:
      type: object
      properties:
        durationHours:
          type: number
          example: 2

    RejectAccessRequestInput:
      type: object
      properties:
        reason:
          type: string
          example: "Operation is too risky"

    AuditLog:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb99"
        actorId:
          type: object
          properties:
            _id: { type: string, example: "65b8c1e6c87881daf598bb90" }
            name: { type: string, example: "Alice Dev" }
            email: { type: string, example: "alice@example.com" }
        action:
          type: string
          example: "auth.login"
        targetType:
          type: string
          example: "User"
        targetId:
          type: string
          example: "65b8c1e6c87881daf598bb90"
        teamId:
          type: string
          example: "65b8c1e6c87881daf598bb91"
        result:
          type: string
          enum: [SUCCESS, FAILURE]
          example: "SUCCESS"
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        _id:
          type: string
          example: "65b8c1e6c87881daf598bb9a"
        recipientId:
          type: string
          example: "65b8c1e6c87881daf598bb90"
        teamId:
          type: string
          example: "65b8c1e6c87881daf598bb91"
        type:
          type: string
          enum: [INVITATION, ROLE_ASSIGNED, ROLE_REVOKED, ACCESS_GRANTED, ACCESS_REVOKED, ACCESS_REQUEST, TEAM_MEMBERSHIP, SYSTEM]
          example: "INVITATION"
        title:
          type: string
          example: "New Team Invitation"
        message:
          type: string
          example: "You have been invited to join team Core Platform."
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

paths:

  # ============================================================================
  # 1. AUTHENTICATION
  # ============================================================================
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: User Login & JWT Issuance
      description: Authenticates user credentials and returns a signed JWT access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "alice@example.com"
                password:
                  type: string
                  example: "Password123!"
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsIn..."
                      requiresPasswordChange:
                        type: boolean
                        example: false
        400:
          description: Invalid input format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Account suspended or disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get Current Authenticated Profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current user profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        401:
          description: Unauthorized / Missing token

  /api/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change User Password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: "OldPassword123!"
                newPassword:
                  type: string
                  example: "NewStrongPass123!"
      responses:
        200:
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password changed successfully."
        400:
          description: Invalid password format or incorrect current password

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: User Logout
      description: Acknowledges stateless user logout and invalidates client session.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logged out successfully."

  # ============================================================================
  # 2. AUTHORIZATION ENGINE
  # ============================================================================
  /api/authorization/check:
    post:
      tags: [Authorization Engine]
      summary: Evaluate Single Permission Check
      description: Real-time decision check evaluating team roles, membership status, and direct grants.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, permission]
              properties:
                teamId:
                  type: string
                  example: "65b8c1e6c87881daf598bb80"
                permission:
                  type: string
                  example: "task.create"
                resource:
                  type: string
                  nullable: true
                  example: "task:65b8c1e6c87881daf598bb90"
      responses:
        200:
          description: Authorization evaluation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      teamId:
                        type: string
                      permission:
                        type: string
                      resource:
                        type: string
                        nullable: true
                      allowed:
                        type: boolean
                        example: true

  /api/authorization/permissions:
    get:
      tags: [Authorization Engine]
      summary: List Resolved Permissions for User in Team
      description: Returns active deduplicated permissions for user in a specified team or all user teams.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: string
            example: "65b8c1e6c87881daf598bb80"
      responses:
        200:
          description: Deduplicated list of resolved permission keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      teamId:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
                        example: ["task.create", "task.read", "team.update"]

  # ============================================================================
  # 3. PERMISSIONS CATALOG
  # ============================================================================
  /api/permissions:
    get:
      tags: [Permissions Catalog]
      summary: List Canonical Permissions
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [TEAM_MANAGEMENT, TASK_MANAGEMENT, ROLE_MANAGEMENT, PERMISSION_MANAGEMENT, ACCESS_REQUESTS, AUDIT_SECURITY, NOTIFICATIONS, SYSTEM_ADMIN]
        - name: resource
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      responses:
        200:
          description: Filtered permissions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
                  count:
                    type: integer

  /api/permissions/{permissionId}:
    get:
      tags: [Permissions Catalog]
      summary: Get Single Permission by ID
      security:
        - bearerAuth: []
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Permission details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Permission'

  # ============================================================================
  # 4. ROLES & ROLE-PERMISSIONS
  # ============================================================================
  /api/roles:
    post:
      tags: [Roles & Permissions]
      summary: Create Dynamic Custom Role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "QA Lead"
                description:
                  type: string
                  example: "Quality Assurance team lead role"
                permissionIds:
                  type: array
                  items:
                    type: string
                  example: ["65b8c1e6c87881daf598bb34"]
      responses:
        201:
          description: Custom role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Role'

    get:
      tags: [Roles & Permissions]
      summary: List Roles
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DISABLED, ARCHIVED]
      responses:
        200:
          description: Roles list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  count:
                    type: integer

  /api/roles/{roleId}:
    get:
      tags: [Roles & Permissions]
      summary: Get Role Details by ID
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Role details with attached permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Role'

    patch:
      tags: [Roles & Permissions]
      summary: Update Role Metadata or Status
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [ACTIVE, DISABLED]
      responses:
        200:
          description: Role updated

    delete:
      tags: [Roles & Permissions]
      summary: Soft Archive Role
      description: Soft-archives a custom role. System roles cannot be deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Role archived

  /api/roles/{roleId}/permissions:
    post:
      tags: [Roles & Permissions]
      summary: Assign Permissions to Role
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds:
                  type: array
                  items:
                    type: string
      responses:
        200:
          description: Permissions attached to role

    get:
      tags: [Roles & Permissions]
      summary: List Permissions for Role
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of permissions attached to the role

  /api/roles/{roleId}/permissions/{permissionId}:
    delete:
      tags: [Roles & Permissions]
      summary: Remove Permission from Role
      security:
        - bearerAuth: []
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Permission removed from role

  # ============================================================================
  # 5. TEAM MEMBERSHIP ROLES
  # ============================================================================
  /api/teams/{teamId}/members/{userId}/roles:
    post:
      tags: [Team Membership Roles]
      summary: Assign Role to Team Member
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
                  example: "65b8c1e6c87881daf598bb56"
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                  example: "2026-12-31T23:59:59.000Z"
      responses:
        201:
          description: Role assigned to team member
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/MembershipRole'

    get:
      tags: [Team Membership Roles]
      summary: List Member Roles with Derived States
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of member role assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MembershipRole'
                  count:
                    type: integer

  /api/teams/{teamId}/members/{userId}/roles/{assignmentId}:
    patch:
      tags: [Team Membership Roles]
      summary: Update Role Assignment TTL Expiration
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expiresAt]
              properties:
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                  example: "2027-01-01T00:00:00.000Z"
      responses:
        200:
          description: Assignment TTL updated

    delete:
      tags: [Team Membership Roles]
      summary: Soft Revoke Role Assignment
      description: Sets revokedAt and revokedBy without destroying the MongoDB audit history.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Role assignment revoked successfully

  # ============================================================================
  # 6. TEAMS (WORKSPACE MANAGEMENT)
  # ============================================================================
  /api/teams/my-teams:
    get:
      tags: [Teams]
      summary: Get Active User Teams
      description: Returns list of active teams where the authenticated user is an active member or has an active access grant.
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of user teams retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        401:
          description: Missing or invalid authentication token

  /api/teams:

    post:
      tags: [Teams]
      summary: Create New Team Workspace
      description: Creates a new team workspace and automatically onboards the creator as the first active member.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Mobile Platform"
                description:
                  type: string
                  example: "Mobile apps and SDK engineering"
      responses:
        201:
          description: Team created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Team'
        400:
          description: Invalid inputs or missing team name
        409:
          description: Team name already exists

    get:
      tags: [Teams]
      summary: List Teams (Paginated & Searchable)
      description: Returns a paginated list of non-archived teams. Supports search query filtering.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: List of teams retrieved successfully

  /api/teams/{teamId}:
    get:
      tags: [Teams]
      summary: Get Team By ID
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Team details retrieved successfully
        404:
          description: Team not found or is archived

    patch:
      tags: [Teams]
      summary: Update Team Metadata
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        200:
          description: Team updated successfully
        404:
          description: Team not found
        409:
          description: Team name collision

    delete:
      tags: [Teams]
      summary: Soft Archive Team Workspace
      description: Marks team status as ARCHIVED without deleting historical data.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Team archived successfully
        404:
          description: Team not found

  # ============================================================================
  # 7. MEMBERSHIPS & LIFECYCLE
  # ============================================================================
  /api/teams/{teamId}/members:
    post:
      tags: [Memberships]
      summary: Add Member to Team Workspace
      description: Adds an existing user to the team with status ACTIVE. If previously removed, reactivates their membership.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  example: "65b8c1e6c87881daf598bb12"
      responses:
        201:
          description: Member added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Membership'
        404:
          description: Team or user not found
        409:
          description: User is already an active member

    get:
      tags: [Memberships]
      summary: List Team Members (Paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: List of team members retrieved successfully

  /api/teams/{teamId}/members/{membershipId}:
    get:
      tags: [Memberships]
      summary: Get Single Membership Details
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Membership retrieved successfully
        404:
          description: Membership not found in team

    delete:
      tags: [Memberships]
      summary: Remove Member From Team Workspace
      description: Transitions membership status to REMOVED, sets removedAt, and soft-revokes all active assigned roles.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Member removed successfully
        404:
          description: Membership not found

  /api/teams/{teamId}/members/{membershipId}/suspend:
    patch:
      tags: [Memberships]
      summary: Suspend Member (Temporary Access Block)
      description: Sets membership status to SUSPENDED. The authorization engine immediately denies all access without deleting role assignments.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Membership suspended successfully
        400:
          description: Membership is already suspended
        404:
          description: Membership not found

  /api/teams/{teamId}/members/{membershipId}/reactivate:
    patch:
      tags: [Memberships]
      summary: Reactivate Suspended Member
      description: Restores membership status to ACTIVE, immediately reenabling access according to their assigned roles.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Membership reactivated successfully
        400:
          description: Membership is already active
        404:
          description: Membership not found

  # ============================================================================
  # 8. USERS (DISCOVERY & SEARCH)
  # ============================================================================
  /api/users/search:
    get:
      tags: [Users]
      summary: Search Users by Name or Email
      description: Allows discovering candidate users for team onboarding. Safely projects profile attributes without password hashes.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            example: "Grace"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: User search results retrieved successfully

  /api/users:
    get:
      tags: [Users]
      summary: List All Non-Disabled Users
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Users list retrieved successfully

  # ============================================================================
  # 9. WORKSPACE INVITATIONS
  # ============================================================================
  /api/teams/{teamId}/invitations:
    post:
      tags: [Workspace Invitations]
      summary: Create Workspace Invitation
      description: >
        Issues a 1-hour cryptographic single-use invitation token with pre-assigned workspace roles.
        Requires dynamic permission `membership.create`.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            example: "65b8c1e6c87881daf598bb90"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        201:
          description: Invitation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Invitation created successfully."
                  data:
                    $ref: '#/components/schemas/Invitation'
        400:
          description: Invalid email format or inactive roles assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        403:
          description: Forbidden - Lacks required permission `membership.create`
        404:
          description: Team not found or is archived
        409:
          description: Conflict - User is already an active member or pending invite exists

    get:
      tags: [Workspace Invitations]
      summary: List Team Invitations
      description: >
        Retrieves all invitations created for this workspace with populated inviter and role metadata.
        Requires dynamic permission `membership.read`.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            example: "65b8c1e6c87881daf598bb90"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
            example: "PENDING"
      responses:
        200:
          description: Team invitations list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        403:
          description: Forbidden - Lacks required permission `membership.read`
        404:
          description: Team not found

  /api/teams/{teamId}/invitations/{invitationId}:
    delete:
      tags: [Workspace Invitations]
      summary: Revoke Pending Invitation
      description: >
        Revokes a pending workspace invitation, preventing the token from being accepted.
        Requires dynamic permission `membership.delete`.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            example: "65b8c1e6c87881daf598bb90"
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            example: "65b8c1e6c87881daf598bba1"
      responses:
        200:
          description: Invitation revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Invitation revoked successfully."
        403:
          description: Forbidden - Lacks required permission `membership.delete`
        404:
          description: Invitation not found
        409:
          description: Conflict - Only pending invitations can be revoked

  /api/invitations/accept:
    post:
      tags: [Workspace Invitations]
      summary: Accept Workspace Invitation (Public Onboarding Gateway)
      description: >
        Public onboarding entry point. Validates cryptographic single-use token, executes atomic ACID
        transaction to provision user (if new), creates active team Membership, assigns pre-configured
        MembershipRoles, transitions invitation to ACCEPTED, and issues an immediate authenticated JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        200:
          description: Invitation accepted successfully; returns active JWT session
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Invitation accepted successfully."
                  data:
                    $ref: '#/components/schemas/AcceptInvitationResponse'
        400:
          description: Token missing, token expired, or missing name/password for new user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Invitation token not found or target team archived
        409:
          description: Conflict - Invitation already accepted/revoked or user already active member

  # ============================================================================
  # 10. TEAM TASKS
  # ============================================================================
  /api/teams/{teamId}/tasks:
    post:
      tags: [Team Tasks]
      summary: Create Task in Team Workspace
      description: >
        Creates a new task within the specified team workspace. Enforces active membership verification
        for `assignedTo` users.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
          description: Target team workspace ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        201:
          description: Task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Task'
        400:
          description: Validation error or assignee is not an active team member
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`task.create`)

    get:
      tags: [Team Tasks]
      summary: List Tasks in Team Workspace
      description: >
        Retrieves a paginated list of tasks within the specified workspace. Supports filtering by status,
        priority, and assignee.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
          description: Target team workspace ID
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE, CANCELLED]
          description: Filter tasks by lifecycle status
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, URGENT]
          description: Filter tasks by priority level
        - name: assignedTo
          in: query
          required: false
          schema:
            type: string
          description: Filter tasks by assignee User ObjectId
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of tasks per page (capped at 100)
      responses:
        200:
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  meta:
                    type: object
                    properties:
                      total: { type: integer, example: 42 }
                      page: { type: integer, example: 1 }
                      limit: { type: integer, example: 20 }
                      totalPages: { type: integer, example: 3 }
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`task.read`)

  /api/teams/{teamId}/tasks/{taskId}:
    get:
      tags: [Team Tasks]
      summary: Get Single Task by ID
      description: >
        Retrieves full details of a single task strictly scoped to the workspace boundary (`teamId`).
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Task'
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`task.read`)
        404:
          description: Task not found in this team workspace

    patch:
      tags: [Team Tasks]
      summary: Update Task
      description: >
        Updates mutable fields of a task (status, priority, assignee, description, dueDate).
        Supports dynamic resource-level grants (`task:<taskId>`).
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        200:
          description: Task updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Task'
        400:
          description: Validation error or invalid assignee
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`task.update`)
        404:
          description: Task not found in this team workspace

    delete:
      tags: [Team Tasks]
      summary: Delete Task
      description: >
        Permanently deletes a task strictly scoped to the workspace boundary.
        Supports dynamic resource-level grants (`task:<taskId>`).
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Task deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Task deleted successfully"
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`task.delete`)
        404:
          description: Task not found in this team workspace

  # ============================================================================
  # 11. ACCESS REQUESTS & TEMPORARY GRANTS
  # ============================================================================
  /api/teams/{teamId}/access-requests:
    post:
      tags: [Access Requests & Grants]
      summary: Submit Access Request
      description: >
        Submits a self-service request for temporary privilege elevation on a specific permission and resource.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
          description: Target team workspace ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessRequestInput'
      responses:
        201:
          description: Access request created in PENDING state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AccessRequest' }
        400:
          description: Target user not an active member or missing parameters
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`access_request.create`)
        409:
          description: Conflict - A pending access request already exists for this permission and resource

    get:
      tags: [Access Requests & Grants]
      summary: List Team Access Requests
      description: >
        Retrieves a paginated list of access requests within the specified team workspace.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, CANCELLED, EXPIRED]
        - name: targetUserId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Access requests retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequest' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer, example: 10 }
                      page: { type: integer, example: 1 }
                      limit: { type: integer, example: 20 }
                      totalPages: { type: integer, example: 1 }
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`access_request.read`)

  /api/teams/{teamId}/access-requests/{requestId}:
    get:
      tags: [Access Requests & Grants]
      summary: Get Single Access Request by ID
      description: Retrieves details of a specific access request strictly scoped to the workspace.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Access request retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AccessRequest' }
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`access_request.read`)
        404:
          description: Access request not found in this team

    patch:
      tags: [Access Requests & Grants]
      summary: Edit Pending Access Request (Requester Self-Correction)
      description: >
        Allows the original requester to modify justification reason, resource, or requested duration
        prior to review. Only permitted while status is `PENDING`.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessRequestInput'
      responses:
        200:
          description: Access request updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AccessRequest' }
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Only original requester can modify request
        404:
          description: Access request not found in this team
        409:
          description: Conflict - Only pending access requests can be modified

    delete:
      tags: [Access Requests & Grants]
      summary: Delete / Withdraw Pending Access Request
      description: >
        Allows the original requester to delete their pending access request. Only permitted while `PENDING`.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Access request deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Access request deleted successfully" }
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Only original requester can delete request
        404:
          description: Access request not found in this team
        409:
          description: Conflict - Only pending access requests can be deleted

  /api/teams/{teamId}/access-requests/{requestId}/approve:
    post:
      tags: [Access Requests & Grants]
      summary: Approve Access Request & Issue Temporary Grant
      description: >
        Approves a pending request and atomically issues an active `AccessGrant` document with TTL expiration.
        Strictly enforces anti-self-approval (`reviewerId !== requesterId`).
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveAccessRequestInput'
      responses:
        200:
          description: Request approved and AccessGrant issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AccessRequest' }
                  grant: { $ref: '#/components/schemas/AccessGrant' }
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions or self-approval violation
        404:
          description: Access request not found in this team
        409:
          description: Conflict - Only pending access requests can be approved

  /api/teams/{teamId}/access-requests/{requestId}/reject:
    post:
      tags: [Access Requests & Grants]
      summary: Reject Access Request
      description: Rejects a pending access request and records reviewer decision metadata.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAccessRequestInput'
      responses:
        200:
          description: Access request rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/AccessRequest' }
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions or self-rejection violation
        404:
          description: Access request not found in this team
        409:
          description: Conflict - Only pending access requests can be rejected

  /api/teams/{teamId}/access-requests/grants/{grantId}:
    delete:
      tags: [Access Requests & Grants]
      summary: Revoke Active Access Grant
      description: Soft-revokes an active direct access grant (`revokedAt = now`).
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - name: grantId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Access grant revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Access grant revoked successfully" }
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`access_request.approve`)
        404:
          description: Active access grant not found in this team

  # ============================================================================
  # 12. AUDIT LOGS
  # ============================================================================
  /api/teams/{teamId}/audit-logs:
    get:
      tags: [Audit Logs]
      summary: Get Team Audit Logs
      description: Returns paginated security audit events for the team. Guarded by `audit.read`.
      security:
        - bearerAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: string }
        - name: actorId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [SUCCESS, FAILURE] }
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: Audit logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer, example: 45 }
                      page: { type: integer, example: 1 }
                      limit: { type: integer, example: 20 }
                      totalPages: { type: integer, example: 3 }
        401:
          description: Missing or invalid authentication token
        403:
          description: Forbidden - Insufficient permissions (`audit.read`)

  # ============================================================================
  # 13. NOTIFICATIONS
  # ============================================================================
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Get My Notifications
      description: Returns paginated in-app notifications for the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        200:
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer, example: 5 }
                      page: { type: integer, example: 1 }
                      limit: { type: integer, example: 20 }
                      totalPages: { type: integer, example: 1 }
        401:
          description: Missing or invalid authentication token

  /api/notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark Single Notification as Read
      description: Marks a specific notification as read (`readAt = now`).
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Notification' }
        401:
          description: Missing or invalid authentication token
        404:
          description: Notification not found

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark All Notifications as Read
      description: Marks all unread notifications for the authenticated user as read.
      security:
        - bearerAuth: []
      responses:
        200:
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      updatedCount: { type: integer, example: 4 }
        401:
          description: Missing or invalid authentication token




